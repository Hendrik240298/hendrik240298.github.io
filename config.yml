baseURL: "https://hendrikfischer.org/"
title: "Hendrik Fischer"
locale: "en-us"
theme: "PaperMod"
enableRobotsTXT: true

permalinks:
  writing: /writing/:slug/

params:
  author: "Hendrik Fischer"
  defaultTheme: dark
  disableThemeToggle: true
  ShowReadingTime: false
  ShowShareButtons: false
  ShowPostNavLinks: false
  hideAuthor: true
  showBreadCrumbs: false
  mainSections: []

  assets:
    favicon: "/images/favicon.svg"
    favicon16x16: "/images/favicon.svg"
    favicon32x32: "/images/favicon.svg"
    apple_touch_icon: "/images/favicon.svg"

markup:
  goldmark:
    extensions:
      footnote: true
    renderer:
      unsafe: true

menu:
  main:
    - name: About
      url: /#about
      weight: 1
    - name: CV
      url: /#cv
      weight: 2
    - name: Projects
      url: /#projects
      weight: 3
    - name: Writing
      url: /writing/
      weight: 4
    - name: Contact
      url: /#contact
      weight: 5
