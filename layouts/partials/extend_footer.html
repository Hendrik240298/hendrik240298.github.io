{{- $wikiPages := dict }}
{{- range site.RegularPages }}
  {{- $page := . }}
  {{- with .File }}
    {{- $wikiPages = merge $wikiPages (dict (lower .BaseFileName) $page.RelPermalink) }}
    {{- $wikiPages = merge $wikiPages (dict (lower $page.Title) $page.RelPermalink) }}
  {{- end }}
{{- end }}
<script>
  (() => {
    const wikilinkPattern = /(!)?\[\[([^\]|#]+?)(?:#([^\]|]+))?(?:\|([^\]]+))?\]\]/g;
    const ignoredTags = new Set(['A', 'CODE', 'PRE', 'SCRIPT', 'STYLE', 'TEXTAREA']);
    const wikiPages = {{ $wikiPages | jsonify | safeJS }};

    document.querySelectorAll('.post-content, .entry-content').forEach((container) => {
      const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
      const textNodes = [];

      while (walker.nextNode()) {
        const node = walker.currentNode;
        if (!ignoredTags.has(node.parentElement.tagName) && node.nodeValue.includes('[[')) {
          textNodes.push(node);
        }
      }

      textNodes.forEach((node) => {
        wikilinkPattern.lastIndex = 0;
        if (!wikilinkPattern.test(node.nodeValue)) {
          return;
        }

        wikilinkPattern.lastIndex = 0;
        const fragment = document.createDocumentFragment();
        let lastIndex = 0;

        node.nodeValue.replace(wikilinkPattern, (match, isEmbed, target, heading, label, index) => {
          fragment.append(document.createTextNode(node.nodeValue.slice(lastIndex, index)));

          if (isEmbed) {
            const image = document.createElement('img');
            const imagePath = target.trim().split('/').map(encodeURIComponent).join('/');
            image.className = 'wikilink-embed';
            image.src = `/images/attachments/${imagePath}`;
            image.alt = label || target;
            image.loading = 'lazy';
            fragment.append(image);
          } else {
            const pageUrl = wikiPages[target.trim().toLowerCase()];
            const reference = document.createElement(pageUrl ? 'a' : 'span');
            reference.className = 'wikilink';
            reference.textContent = label || target;
            if (pageUrl) {
              reference.href = heading ? `${pageUrl}#${heading}` : pageUrl;
            }
            fragment.append(reference);
          }

          lastIndex = index + match.length;
          return match;
        });

        fragment.append(document.createTextNode(node.nodeValue.slice(lastIndex)));
        node.replaceWith(fragment);
      });
    });
  })();
</script>
<script>
  (() => {
    const eventForLink = (link) => {
      const url = new URL(link.href, window.location.origin);

      if (url.pathname.endsWith('.pdf') && url.pathname.includes('/files/cv/')) {
        return 'cv-download';
      }

      if (url.protocol === 'mailto:') {
        return 'email-click';
      }

      if (url.hostname === 'github.com') {
        return 'github-click';
      }

      if (url.hostname === 'www.linkedin.com' || url.hostname === 'linkedin.com') {
        return 'linkedin-click';
      }

      if (url.hostname === 'scholar.google.de' || url.hostname === 'scholar.google.com') {
        return 'scholar-click';
      }

      return url.origin !== window.location.origin ? 'outbound-click' : null;
    };

    document.addEventListener('click', (event) => {
      const link = event.target.closest('a[href]');
      if (!link || !window.umami) {
        return;
      }

      const eventName = eventForLink(link);
      if (eventName) {
        window.umami.track(eventName);
      }
    });
  })();
</script>
